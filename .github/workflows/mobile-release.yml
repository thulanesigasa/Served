name: Served mobile build or OTA

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile and OTA channel
        required: true
        type: choice
        options: [development, production]
      operation:
        description: Create a new binary or publish an OTA update
        required: true
        type: choice
        options: [build, ota]
      platform:
        description: Target platform
        required: true
        default: android
        type: choice
        options: [android, ios, all]

permissions:
  contents: read

concurrency:
  group: served-mobile-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      PROFILE: ${{ inputs.profile }}
      PLATFORM: ${{ inputs.platform }}
    steps:
      - name: Check selected release
        working-directory: .
        run: |
          if [ "$PROFILE" = production ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run production builds and OTA updates from main."
            exit 1
          fi
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the Expo access token as the EXPO_TOKEN GitHub Actions secret."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Install EAS CLI
        run: npm install --global eas-cli@27.11.0
      - name: Link Expo project
        run: |
          if [ -n "$EXPO_PROJECT_ID" ]; then
            eas init --id "$EXPO_PROJECT_ID" --force --non-interactive
          else
            eas init --force --non-interactive
          fi
          node scripts/configure-updates.cjs
      - name: Build mobile binaries
        if: inputs.operation == 'build'
        run: eas build --profile "$PROFILE" --platform "$PLATFORM" --non-interactive --wait
      - name: Publish mobile OTA
        if: inputs.operation == 'ota'
        run: |
          eas update --channel "$PROFILE" --environment "$PROFILE" --platform "$PLATFORM" \
            --message "Served ${GITHUB_SHA:0:8}" --non-interactive
